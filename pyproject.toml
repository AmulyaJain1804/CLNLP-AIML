    "accelerate>=1.16.0",
    "bert-score>=0.3.13",
    "datasets>=5.2.0",
    "evaluate>=0.4.6",
    "gensim>=4.4.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "nltk>=3.10.4",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "protobuf>=7.36.2",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.3",
    "spacy>=3.8.18",
    "tiktoken>=0.14.0",
